name: Issue 50 lifecycle runner

on:
  push:
    branches:
      - fix/50-lifecycle-transaction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply stored issue 50 patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/50-lifecycle-transaction
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-50-patch.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          block = workflow[start:end]
          normalized = []
          for line in block:
              normalized.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/issue50_patch.py').write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          python3 /tmp/issue50_patch.py
          rm -f .github/workflows/issue-50-patch.yml .github/workflows/issue-50-runner.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/M_DatePicker.bas .github/workflows/issue-50-patch.yml .github/workflows/issue-50-runner.yml
          git commit -m "fix(#50): make lifecycle cleanup transactional and observable [skip ci]"
          git push origin HEAD:fix/50-lifecycle-transaction
