name: Detect issue-label drift
run-name: Label drift — ${{ github.ref_name }} @ ${{ github.sha }}

# Pull requests exercise only deterministic offline fixtures. Scheduled and
# manual detection read the live label catalogue with read-only permissions.
# This workflow has no repository mutation path; reconciliation remains in
# labels-sync.yml on trusted events.

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - .github/labels.json
      - .github/labels-policy.json
      - .github/scripts/labels-drift.mjs
      - .github/scripts/labels-sync.mjs
      - .github/workflows/labels-drift.yml
      - .github/workflows/labels-sync.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fixtures:
    name: Label drift fixtures
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise deterministic read-only drift fixtures
        run: node .github/scripts/labels-drift.mjs --policy .github/labels-policy.json --self-test

  detect:
    name: Live label drift
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read

    steps:
      - name: Check out the exact SHA to inspect
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise deterministic read-only drift fixtures
        id: fixtures
        continue-on-error: true
        run: node .github/scripts/labels-drift.mjs --policy .github/labels-policy.json --self-test

      - name: Compare live labels with versioned policy
        id: drift
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node .github/scripts/labels-drift.mjs --policy .github/labels-policy.json
          --repository "${GITHUB_REPOSITORY}"
          --output test-results/labels-drift.json
          --summary test-results/labels-drift.md

      - name: Upload label-drift evidence
        id: artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: label-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/labels-drift.json
            test-results/labels-drift.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce drift and evidence outcomes
        if: always()
        env:
          FIXTURE_OUTCOME: ${{ steps.fixtures.outcome }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          failed=0
          for item in \
            "Drift fixtures:$FIXTURE_OUTCOME" \
            "Live label comparison:$DRIFT_OUTCOME" \
            "Evidence upload:$ARTIFACT_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name outcome: $outcome"
              failed=1
            fi
          done
          exit "$failed"
