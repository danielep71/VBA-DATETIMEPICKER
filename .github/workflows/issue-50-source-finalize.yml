name: Issue 50 source finalization

on:
  push:
    branches:
      - fix/50-lifecycle-transaction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Finalize source transaction model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/50-lifecycle-transaction
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/modules/M_DatePicker.bas')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1, found {n}')
              s = s.replace(old, new, 1)

          # Keep the reset seam internal to deterministic tests by requiring an
          # argument; unlike a parameterless Public Sub it is not an Alt+F8 macro.
          one(
          '''Public Sub M_Lifecycle_Test_Reset()\n\n    mDP_LifecycleFaultStep = VBA.vbNullString\n''',
          '''Public Sub M_Lifecycle_Test_Reset(ByVal ResetState As Boolean)\n\n    If Not ResetState Then Exit Sub\n\n    mDP_LifecycleFaultStep = VBA.vbNullString\n''',
          'reset seam signature')

          # Successful startup event restoration is itself an explicit step so a
          # rare restoration failure is diagnosed at the correct boundary.
          one(
          '''CleanExit:\n    If HasCallerEnableEvents Then Excel.Application.EnableEvents = CallerEnableEvents\n    Exit Sub\n''',
          '''CleanExit:\n    HandlerStep = "Restore caller event state"\n    If HasCallerEnableEvents Then Excel.Application.EnableEvents = CallerEnableEvents\n    Exit Sub\n''',
          'start clean-exit step')

          # Repair mutation seams fire after each successful mutation, matching
          # startup semantics and proving rollback from actual partial rebuilds.
          repl = [
              ('    HandlerStep = "Recreate manager"\n    M_Lifecycle_RaiseIfFault "Repair.Manager"\n    M_Picker_EnsureManager\n',
               '    HandlerStep = "Recreate manager"\n    M_Picker_EnsureManager\n    M_Lifecycle_RaiseIfFault "Repair.AfterManager"\n'),
              ('    HandlerStep = "Synchronize right-click menu"\n    M_Lifecycle_RaiseIfFault "Repair.ContextMenu"\n    M_ContextMenu_Update\n',
               '    HandlerStep = "Synchronize right-click menu"\n    M_ContextMenu_Update\n    M_Lifecycle_RaiseIfFault "Repair.AfterContextMenu"\n'),
              ('    HandlerStep = "Synchronize keyboard shortcut"\n    M_Lifecycle_RaiseIfFault "Repair.Keyboard"\n    M_KeyboardShortcut_Update\n',
               '    HandlerStep = "Synchronize keyboard shortcut"\n    M_KeyboardShortcut_Update\n    M_Lifecycle_RaiseIfFault "Repair.AfterKeyboard"\n'),
              ('    HandlerStep = "Refresh current selection context"\n    M_Lifecycle_RaiseIfFault "Repair.Refresh"\n    If Not gDP_Manager Is Nothing Then gDP_Manager.Handle_SelectionChange\n',
               '    HandlerStep = "Refresh current selection context"\n    If Not gDP_Manager Is Nothing Then gDP_Manager.Handle_SelectionChange\n    M_Lifecycle_RaiseIfFault "Repair.AfterRefresh"\n'),
          ]
          for i, (old, new) in enumerate(repl, 1):
              one(old, new, f'repair boundary {i}')

          # DP_Stop delegates the full normal lifecycle contract to the common
          # transaction. Caller event restoration happens inside it before lease
          # deletion. If caller event state cannot be captured, cleanup still runs
          # but lease release is intentionally withheld.
          pat = re.compile(r'(?ms)^Public Sub DP_Stop\(\)\n.*?^End Sub\s*\n')
          new = '''Public Sub DP_Stop()\n\n\'\n\'------------------------------------------------------------------------------\n\'                           STOP DATEPICKER\n\'------------------------------------------------------------------------------\n\' PURPOSE\n\'   Tears down DatePicker-owned runtime state and releases the provider lease only\n\'   after every critical cleanup boundary, including caller event-state restore,\n\'   is proven clean\n\'\n\' ERROR POLICY\n\'   Best-effort outward behavior is preserved. Incomplete cleanup is diagnostic,\n\'   retains ownership, and is retryable by a later DP_Stop call\n\'\n\' UPDATED\n\'   2026-09-05\n\'------------------------------------------------------------------------------\n\n    Dim CallerEnableEvents As Boolean\n    Dim HasCallerEnableEvents As Boolean\n\n    On Error Resume Next\n    M_Lifecycle_ResetObservation\n\n    CallerEnableEvents = Excel.Application.EnableEvents\n    HasCallerEnableEvents = (Err.Number = 0)\n    Err.Clear\n\n    If Not M_Lease_IsOwner() Then\n        M_Lease_ReportRefusal "DP_Stop"\n        GoTo CleanExit\n    End If\n\n    If HasCallerEnableEvents Then\n        M_Lifecycle_Cleanup True, "DP_Stop", True, CallerEnableEvents\n    Else\n        M_Lifecycle_Cleanup False, "DP_Stop"\n        mDP_LifecycleLastCriticalClean = False\n        If VBA.LenB(mDP_LifecycleLastCleanupDetail) = 0 Then\n            mDP_LifecycleLastCleanupDetail = _\n                "Application.EnableEvents caller state could not be captured"\n        End If\n        mDP_LifecycleLastTrace = mDP_LifecycleLastTrace & _\n            " > EnableEvents=FAIL > Lease=RETAINED"\n    End If\n\nCleanExit:\n    Err.Clear\n    On Error GoTo 0\n\nEnd Sub\n\n'''
          s, n = pat.subn(new, s, count=1)
          if n != 1:
              raise SystemExit(f'DP_Stop replace expected 1, found {n}')

          required = [
              'Public Sub M_Lifecycle_Test_Reset(ByVal ResetState As Boolean)',
              'HandlerStep = "Restore caller event state"',
              '"Repair.AfterManager"',
              '"Repair.AfterContextMenu"',
              '"Repair.AfterKeyboard"',
              '"Repair.AfterRefresh"',
              'M_Lifecycle_Cleanup True, "DP_Stop", True, CallerEnableEvents',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing required token: {token}')
          for token in ['"Repair.Manager"', '"Repair.ContextMenu"', '"Repair.Keyboard"', '"Repair.Refresh"']:
              if token in s:
                  raise SystemExit(f'stale repair seam remains: {token}')
          if s.count('Public Sub DP_Stop()') != 1:
              raise SystemExit('DP_Stop structural guard failed')

          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/issue-50-source-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/M_DatePicker.bas .github/workflows/issue-50-source-finalize.yml
          git commit -m "fix(#50): finalize lifecycle transaction boundaries [skip ci]"
          git push origin HEAD:fix/50-lifecycle-transaction
