name: Static repository checks
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: DateTimePicker source and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Validate workflow syntax with verified actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 2 --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck="" -pyflakes=""
      - name: Install Python lint tools (hash-locked, wheels only)
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements-lint.txt
      - name: Lint Python with Ruff
        shell: bash
        run: ruff check --output-format=github
      - name: Type-check Python with strict mypy
        shell: bash
        run: mypy
      - name: Run portable checks
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--ci)
          if [[ -n "$PR_BASE" ]]; then args+=(--base "$PR_BASE"); fi
          python tools/check.py "${args[@]}"
      - name: Report VBA call resolution (advisory, non-blocking)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python tools/check_vba_calls.py --root . \
            --output test-results/check_vba_calls.json \
            --summary test-results/check_vba_calls.md
          status=$?
          if [[ -f test-results/check_vba_calls.md ]]; then
            cat test-results/check_vba_calls.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Show summary
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/static-checks.md ]]; then
            cat test-results/static-checks.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-checks-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30
  minimum-python:
    name: Tool tests on the minimum supported Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Keep in step with the minimum documented in tools/README.md.
          python-version: "3.11"
      - name: Run tooling tests and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools -p "test_*.py"
          for name in check_vba_conditionals check_vba_jumps check_committed_whitespace; do
            python "tools/$name.py" --self-test
          done
