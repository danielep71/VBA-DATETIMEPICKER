name: Issue 50 lifecycle regression patch

on:
  push:
    branches:
      - fix/50-lifecycle-transaction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Add LifecycleTransaction regression suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/50-lifecycle-transaction
          python3 .github/tmp_issue50_test_patch.py
          rm .github/tmp_issue50_test_patch.py
          rm .github/workflows/issue-50-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/M_cDP_Test.bas .github/tmp_issue50_test_patch.py .github/workflows/issue-50-tests.yml
          git commit -m "test(#50): add deterministic lifecycle transaction matrix [skip ci]"
          git push origin HEAD:fix/50-lifecycle-transaction
