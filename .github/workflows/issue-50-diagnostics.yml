name: Issue 50 diagnostics completion

on:
  push:
    branches:
      - fix/50-lifecycle-transaction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Complete lifecycle diagnostic state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout fix/50-lifecycle-transaction
          python3 .github/tmp_issue50_diag_patch.py
          rm .github/tmp_issue50_diag_patch.py
          rm .github/workflows/issue-50-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/M_DatePicker.bas .github/tmp_issue50_diag_patch.py .github/workflows/issue-50-diagnostics.yml
          git commit -m "fix(#50): complete lifecycle diagnostic state [skip ci]"
          git push origin HEAD:fix/50-lifecycle-transaction
