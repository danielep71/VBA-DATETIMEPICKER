# ---------------------------------------------------------------------------
# Daily traffic export
#
#   Reads the GitHub traffic API for this repository and appends a daily
#   snapshot to CSV files on the orphan `traffic-history` branch. It also
#   writes data/badges/clones.json, visitors.json and visits.json there, the
#   shields.io endpoints behind the README clones, visitors and visits badges.
#   tools/traffic_export.py builds the history and the alert issue.
#
#   Data retention
#     GitHub retains traffic data for 14 days only. This workflow exists to
#     keep a longer history. The `traffic-history` branch is public, and the
#     data it holds — view counts, clone counts, referrers, popular paths — is
#     the same aggregate data GitHub already exposes to repository admins. It
#     contains no identifying information about individual visitors.
#
#   Credentials
#     The traffic API requires `Administration: read`. A GitHub App installed
#     on this repository only, with that single permission, provides it. The
#     repository-level `analytics` environment holds:
#       TRAFFIC_APP_CLIENT_ID    environment variable: the App's client ID
#       TRAFFIC_APP_PRIVATE_KEY  environment secret: the App's private key
#     Only the token step receives the private key, and only the fetch step
#     receives the token it mints. The token is scoped to this repository and
#     to `administration: read`, expires after one hour and is revoked when
#     the job ends. No long-lived token exists. The environment is not a
#     workflow-identity boundary: any job declaring it may request access,
#     subject to the configured environment protections. Key rotation and
#     revocation are described in SECURITY.md.
#
#   Scope
#     This is repository analytics. It is not CI. It compiles nothing, runs no
#     tests, and must never be extended to do so. CI lives in separate
#     workflows (static-checks.yml, codeql.yml), so that the analytics key is
#     never available to a job that executes pull-request code. This job runs
#     only tools/traffic_export.py from the default branch, and that step
#     never receives the App key or token.
# ---------------------------------------------------------------------------

name: Daily traffic export

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Least privilege. Write grants are scoped to the traffic job:
#   contents: write  pushes the CSV history to the traffic-history branch
#   issues:   write  opens an alert issue on a traffic spike or new referrer
# Nothing else is granted to GITHUB_TOKEN. The App token is separate.
permissions:
  contents: read

concurrency:
  group: daily-traffic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  traffic:
    name: Export GitHub traffic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    # Requests the repository-level analytics environment. Keep this declaration
    # out of every code-executing build, test and release job; the environment
    # name alone does not bind the key to this workflow identity.
    environment: analytics

    steps:
      - name: Checkout main branch
        # v7.0.1 - pinned to a full commit SHA so a moved tag cannot change what runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare traffic-history worktree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Exit code 2 means the branch does not exist yet; any other failure stops here.
          status=0
          git -c http.extraheader="$auth" ls-remote --exit-code --heads origin traffic-history >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git -c http.extraheader="$auth" fetch --no-tags origin traffic-history:traffic-history
            git worktree add history traffic-history
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach history
            git -C history checkout --orphan traffic-history
            git -C history rm -rf --quiet .
          else
            echo "::error::Could not query the traffic-history branch (exit $status)"
            exit 1
          fi

          mkdir -p history/data

      - name: Mint a short-lived traffic token
        id: traffic-token
        # v3.3.0 - pinned to a full commit SHA. Revokes the token when the job ends.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Fetch GitHub traffic API data
        shell: bash
        env:
          TRAFFIC_TOKEN: ${{ steps.traffic-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          API_VERSION="2026-03-10"
          BASE_URL="https://api.github.com/repos/$REPO"
          API_DIR="$RUNNER_TEMP/traffic-api"
          mkdir -p "$API_DIR"

          api_get() {
            local label="$1"
            local url="$2"
            local output="$3"
            local status

            status=$(curl -sS -L \
              -o "$output" \
              -w "%{http_code}" \
              -H "Authorization: Bearer $TRAFFIC_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $API_VERSION" \
              "$url")

            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$label failed with HTTP $status"
              echo "Response body:"
              head -c 2000 "$output" || true
              echo
              exit 1
            fi
          }

          api_get "Page views" "$BASE_URL/traffic/views?per=day" "$API_DIR/views.json"
          api_get "Clones" "$BASE_URL/traffic/clones?per=day" "$API_DIR/clones.json"
          api_get "Top referrers" "$BASE_URL/traffic/popular/referrers" "$API_DIR/referrers.json"
          api_get "Popular paths" "$BASE_URL/traffic/popular/paths" "$API_DIR/paths.json"
          api_get "Repository metadata" "$BASE_URL" "$API_DIR/repo.json"

      - name: Build CSV history
        shell: bash
        run: python3 tools/traffic_export.py build --api-dir "$RUNNER_TEMP/traffic-api" --data-dir history/data

      - name: Commit traffic history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git -C history add data/

          if git -C history diff --cached --quiet; then
            echo "No traffic changes to commit"
          else
            git -C history commit -m "Update traffic history"
          fi

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C history -c http.extraheader="$auth" push origin HEAD:traffic-history

      - name: Create alert issue on spike or new referrer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/traffic_export.py alert --data-dir history/data
