name: Check Ribbon resources

# Fails when the RibbonX source under src/ribbon/ references a custom image
# with no tracked file or relationship, or when a Ribbon part's namespace does
# not match its file name (#90). Read-only: it never changes the repository.

on:
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - src/ribbon/**
      - .github/scripts/check-ribbon-resources.py
      - .github/workflows/ribbon-resources.yml
  push:
    branches:
      - main
      - "release/**"
    paths:
      - src/ribbon/**
      - .github/scripts/check-ribbon-resources.py
      - .github/workflows/ribbon-resources.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ribbon-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Ribbon source completeness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out the exact SHA under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise the check against its failure cases
        run: python3 .github/scripts/check-ribbon-resources.py --self-test

      - name: Check the tracked Ribbon source
        run: python3 .github/scripts/check-ribbon-resources.py --root src/ribbon
