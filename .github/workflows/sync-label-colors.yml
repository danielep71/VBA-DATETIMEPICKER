name: Sync issue label colors

on:
  push:
    paths:
      - .github/workflows/sync-label-colors.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Apply label color policy
    runs-on: ubuntu-latest

    steps:
      - name: Update label colors
        uses: actions/github-script@v7
        with:
          script: |
            const colors = {
              "api": "0052cc",
              "bug": "d73a4a",
              "CI": "24292f",
              "documentation": "0075ca",
              "enhancement": "a2eeef",
              "good first issue": "7057ff",
              "help wanted": "008672",
              "P1": "b60205",
              "P2": "d93f0b",
              "P3": "fbca04",
              "refactor": "6f42c1",
              "release": "b60276",
              "tests": "006b75",
              "testing": "006b75",
              "code": "0052cc",
              "repository": "1d76db",
              "behavior-change": "c24e00",
              "winapi": "5319e7",
              "security": "b60205",
              "accessibility": "7057ff",
              "demo": "0e8a16",
              "ribbon": "5319e7",
              "compatibility": "c5def5",
              "performance": "1d76db",
              "state-management": "0e8a16",
              "timing": "5319e7",
              "measurement": "1d76db",
              "statistics": "c5def5",
              "duplicate": "cfd3d7",
              "invalid": "e4e669",
              "question": "d876e3",
              "wontfix": "ffffff"
            };

            const labels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const existing = new Map(labels.map(label => [label.name, label]));
            const unmapped = labels
              .filter(label => colors[label.name] === undefined)
              .map(label => `${label.name}=#${label.color}`);

            core.info(`Existing labels (${labels.length}): ${labels.map(label => label.name).join(', ')}`);

            for (const [name, color] of Object.entries(colors)) {
              if (!existing.has(name)) continue;

              const current = existing.get(name).color.toLowerCase();
              if (current === color.toLowerCase()) {
                core.info(`${name}: already #${color}`);
                continue;
              }

              await github.rest.issues.updateLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                color
              });
              core.info(`${name}: #${current} -> #${color}`);
            }

            if (unmapped.length > 0) {
              core.warning(`Unmapped labels left unchanged: ${unmapped.join(', ')}`);
            }
